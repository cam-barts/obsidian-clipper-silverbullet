name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome
        run: npm run build:chrome

      - name: Build Firefox
        run: npm run build:firefox

      - name: Sign Firefox extension
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          npx web-ext sign \
            --source-dir dist/firefox/ \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --channel unlisted \
            --artifacts-dir signed/
          # web-ext sign outputs a .xpi — rename it to something predictable
          VERSION="${GITHUB_REF_NAME#v}"
          mv signed/*.xpi "builds/silverbullet-web-clipper-${VERSION}-firefox.xpi"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            builds/silverbullet-web-clipper-*.zip
            builds/silverbullet-web-clipper-*.xpi
          generate_release_notes: true
